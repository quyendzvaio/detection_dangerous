name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ae-ai-hit16

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/visionguard-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/visionguard-backend:latest
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/visionguard-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/visionguard-frontend:latest
      - name: Build and publish edge agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge_agent/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/visionguard-edge-agent:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/visionguard-edge-agent:latest
      - name: Build and publish inference worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference_worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/visionguard-inference:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/visionguard-inference:latest

  deploy-cloud:
    needs: publish
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy cloud deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/cloud,triton_model_repo"
          target: ${{ vars.DEPLOY_PATH }}
      - name: Restart cloud stack and verify health
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH/cloud"
            docker compose pull control-plane inference-worker
            docker compose up -d --remove-orphans
            sleep 10
            curl --fail --silent http://127.0.0.1:${CONTROL_PLANE_PORT:-8080}/health/ready
