# Production deployment requires TLS certificates and a generated password
# file at ./secrets/mosquitto.passwd. No retained messages or persistent
# sessions are used by the application publisher.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwordfile
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
per_listener_settings true
persistence false

